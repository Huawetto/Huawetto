<style>
:root {
  --font: "Plus Jakarta Sans", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  --grad: linear-gradient(120deg, #6a4dff 0%, #ff4fa3 55%, #ffb02e 100%);
  --grad-soft: linear-gradient(120deg, rgba(106,77,255,.14), rgba(255,79,163,.12) 55%, rgba(255,176,46,.14));
  --go: linear-gradient(135deg, #14c38e, #2a8bff);
  --stop: linear-gradient(135deg, #ff4d6d, #ff9a3c);
  --bg: #f3f0ff;
  --bg2: #fdf1fb;
  --panel: rgba(255,255,255,.72);
  --panel-solid: #ffffff;
  --panel-2: rgba(255,255,255,.5);
  --text: #231b4a;
  --muted: #7a73a8;
  --line: rgba(98, 80, 190, .16);
  --accent: #6a4dff;
  --accent2: #ff4fa3;
  --danger: #ef476f;
  --ok: #19b97a;
  --shadow: 0 10px 40px rgba(76, 50, 170, .16);
  --shadow-s: 0 3px 12px rgba(76, 50, 170, .14);
  --radius: 18px;
  --canvas: #f6f4ff;
}
:root[data-ui="dark"] {
  --bg: #0f0b24;
  --bg2: #1a1038;
  --panel: rgba(30, 22, 64, .72);
  --panel-solid: #1c1440;
  --panel-2: rgba(40, 30, 86, .55);
  --text: #eeeaff;
  --muted: #9a92cf;
  --line: rgba(160, 140, 255, .18);
  --shadow: 0 10px 40px rgba(0,0,0,.5);
  --shadow-s: 0 3px 14px rgba(0,0,0,.4);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font);
  color: var(--text);
  background:
    radial-gradient(900px 600px at 8% -10%, rgba(106,77,255,.20), transparent 60%),
    radial-gradient(800px 600px at 105% 0%, rgba(255,79,163,.18), transparent 60%),
    radial-gradient(900px 700px at 60% 120%, rgba(255,176,46,.16), transparent 60%),
    linear-gradient(160deg, var(--bg), var(--bg2));
  background-attachment: fixed;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font-family: inherit; font-size: 14px; color: inherit; }
.hidden { display: none !important; }
.spacer { flex: 1; }

#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; padding: 10px; gap: 10px; }

/* ---------- barra superiore ---------- */
#topbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 8px 12px; border-radius: var(--radius);
  background: var(--panel); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
  border: 1px solid var(--line); box-shadow: var(--shadow-s);
  position: relative;
}
#topbar::after {
  content: ""; position: absolute; left: 14px; right: 14px; bottom: -1px; height: 3px; border-radius: 3px;
  background: var(--grad); opacity: .85; filter: blur(.3px);
}
#brand { display: flex; align-items: center; gap: 10px; padding-right: 6px; user-select: none; }
.logo { width: 38px; height: 38px; filter: drop-shadow(0 4px 10px rgba(106,77,255,.45)); }
.brandtext { display: flex; flex-direction: column; line-height: 1; font-weight: 800; letter-spacing: -.01em; }
.brandtext b { font-size: 17px; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brandtext span { font-size: 11px; letter-spacing: .38em; text-transform: uppercase; color: var(--muted); margin-top: 3px; font-weight: 700; }
.progname {
  width: 150px; max-width: 18vw; font-weight: 700; padding: 8px 12px; border-radius: 12px;
  border: 1px solid transparent; background: transparent; outline: none; text-overflow: ellipsis;
}
.progname:hover { background: var(--panel-2); }
.progname:focus { border-color: var(--accent); background: var(--panel-solid); box-shadow: 0 0 0 3px rgba(106,77,255,.18); }
.group { display: flex; align-items: center; gap: 4px; padding: 3px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); }
.group.right { margin-left: auto; }
.tb {
  display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 11px;
  border: 0; background: transparent; cursor: pointer; font-weight: 600; white-space: nowrap;
  transition: background .15s, transform .12s, box-shadow .15s, opacity .15s;
}
.tb.icon { padding: 0; width: 34px; justify-content: center; }
.tb:hover:not(:disabled) { background: rgba(106,77,255,.13); }
.tb:active:not(:disabled) { transform: scale(.95); }
.tb:disabled { opacity: .35; cursor: default; }
.tb.go { color: #fff; background: var(--go); box-shadow: 0 6px 18px rgba(20,195,142,.38); }
.tb.go:hover:not(:disabled) { background: var(--go); filter: brightness(1.08); }
.tb.stop { color: #fff; background: var(--stop); }
.tb.stop:hover:not(:disabled) { background: var(--stop); filter: brightness(1.08); }
.tb.small { height: 32px; padding: 0 12px; }
.ic { display: inline-flex; width: 18px; height: 18px; flex: none; }
.ic svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ic svg .fill { fill: currentColor; stroke: none; }
.speed { display: flex; align-items: center; gap: 6px; padding: 0 8px; color: var(--muted); }
.speed input { width: 86px; accent-color: var(--accent2); }
.speed b { min-width: 52px; font-size: 12px; color: var(--text); }
body.running #btnRun, body.running #btnNew { }
body.running .group#gEdit .tb { opacity: .4; pointer-events: none; }

/* ---------- area principale ---------- */
#main { flex: 1; min-height: 0; display: flex; gap: 10px; position: relative; }
#palette {
  width: 212px; flex: none; display: flex; flex-direction: column; min-height: 0;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-s);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); overflow: hidden;
}
.palhead { padding: 10px; }
#palSearch { width: 100%; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-solid); outline: none; }
#palSearch:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(106,77,255,.16); }
#palList { flex: 1; overflow-y: auto; padding: 0 10px 10px; }
.palcat { margin-top: 10px; }
.palcat h4 { margin: 0 0 6px 2px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
.palitem {
  display: flex; align-items: center; gap: 9px; padding: 7px 9px; margin-bottom: 5px; border-radius: 12px; cursor: grab;
  background: var(--panel-solid); border: 1px solid var(--line); font-weight: 600; font-size: 13px; user-select: none; touch-action: none;
  transition: transform .12s, box-shadow .15s, border-color .15s;
}
.palitem:hover { transform: translateY(-1px); box-shadow: var(--shadow-s); border-color: var(--accent); }
.palitem .chipic {
  width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; color: #fff; font-size: 14px; flex: none;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.4);
}
.palfoot { padding: 10px 12px; font-size: 11.5px; line-height: 1.45; color: var(--muted); border-top: 1px solid var(--line); }

#stage {
  flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-s); overflow: hidden;
}
#tabs { display: flex; gap: 6px; padding: 8px 10px 0; overflow-x: auto; flex: none; scrollbar-width: thin; }
.tab {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 12px 12px 0 0; cursor: pointer; font-weight: 700; font-size: 13px;
  background: var(--panel-2); border: 1px solid var(--line); border-bottom: 0; color: var(--muted); white-space: nowrap; user-select: none;
}
.tab.on { color: var(--text); background: var(--panel-solid); position: relative; }
.tab.on::after { content: ""; position: absolute; left: 10px; right: 10px; top: 0; height: 3px; border-radius: 3px; background: var(--grad); }
.tab.add { color: var(--accent); }
.tab small { font-weight: 600; opacity: .6; }
#viewport {
  flex: 1; overflow: auto; position: relative; background: var(--canvas); border-top: 1px solid var(--line);
  background-image: radial-gradient(circle at 1px 1px, rgba(120,110,190,.22) 1px, transparent 0); background-size: 24px 24px;
  scrollbar-color: rgba(120,110,190,.5) transparent;
  cursor: default;
}
#viewport.panning { cursor: grabbing; }
#chartHost { display: inline-block; min-width: 100%; min-height: 100%; padding: 0; transform-origin: 0 0; }
#chartHost svg { display: block; margin: 0 auto; overflow: visible; user-select: none; }
#chartHost svg text { user-select: none; }

/* elementi interattivi del diagramma */
.blk { cursor: pointer; }
.blk .shp { transition: filter .15s; }
.blk:hover .shp { filter: brightness(1.07) drop-shadow(0 0 6px rgba(106,77,255,.55)); }
.blk.sel .shp { stroke: #ff4fa3 !important; stroke-width: 3.6 !important; filter: drop-shadow(0 0 9px rgba(255,79,163,.85)); }
.blk.run .shp { stroke: #19e68c !important; stroke-width: 4 !important; animation: runpulse 1s ease-in-out infinite; }
.blk.err .shp { stroke: #ff2e4d !important; stroke-width: 4 !important; stroke-dasharray: 7 4; animation: errpulse .7s ease-in-out infinite alternate; }
@keyframes runpulse { 0%,100% { filter: drop-shadow(0 0 4px rgba(25,230,140,.6)); } 50% { filter: drop-shadow(0 0 16px rgba(25,230,140,1)); } }
@keyframes errpulse { from { filter: drop-shadow(0 0 3px rgba(255,46,77,.5)); } to { filter: drop-shadow(0 0 14px rgba(255,46,77,1)); } }
.ins { cursor: pointer; opacity: 0; transition: opacity .12s; }
.ins .insbg { fill: #fff; stroke: var(--accent); stroke-width: 1.8; }
.ins .insplus { stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; fill: none; }
#viewport:hover .ins { opacity: .22; }
.ins:hover, .ins.target { opacity: 1 !important; }
.ins:hover .insbg, .ins.target .insbg { fill: var(--accent); }
.ins:hover .insplus, .ins.target .insplus { stroke: #fff; }
.ins.target .insbg { fill: var(--accent2); stroke: var(--accent2); }
.ins.target { transform-box: fill-box; }
.bp { cursor: pointer; opacity: 0; }
.bp .bphit { fill: transparent; }
.bp .bpdot { fill: rgba(239,71,111,.35); stroke: #ef476f; stroke-width: 1.5; }
.blk:hover .bp { opacity: 1; }
.bp.on { opacity: 1; }
.bp.on .bpdot { fill: #ef476f; filter: drop-shadow(0 0 4px rgba(239,71,111,.8)); }
.warn { cursor: help; }
.blk.hasbp .shp { stroke: #ef476f; stroke-dasharray: 7 4; }
.dragging-over { cursor: grabbing; }

#zoomCtl, #blockBar {
  position: absolute; display: flex; gap: 4px; padding: 5px; border-radius: 14px; z-index: 6;
  background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); box-shadow: var(--shadow-s);
}
#zoomCtl { right: 14px; bottom: 14px; }
#blockBar { left: 50%; transform: translateX(-50%); top: 52px; }
.mini {
  display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 6px; border: 0; border-radius: 9px; background: transparent; cursor: pointer; color: var(--text);
}
.mini:hover { background: rgba(106,77,255,.14); }
.mini.danger:hover { background: rgba(239,71,111,.18); color: var(--danger); }
.mini.lab { font-size: 12px; font-weight: 700; min-width: 54px; }
.mini.on { background: var(--grad-soft); color: var(--accent); }
.mini .ic { width: 17px; height: 17px; }
#status {
  position: absolute; left: 14px; bottom: 14px; max-width: calc(100% - 200px); padding: 7px 12px; border-radius: 12px; font-size: 12.5px; font-weight: 600;
  background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow-s); backdrop-filter: blur(12px); display: none; z-index: 5;
}
#status.show { display: block; }
#status.err { background: linear-gradient(120deg, rgba(255,46,77,.95), rgba(255,120,60,.95)); color: #fff; border-color: transparent; }
#status.ok { background: linear-gradient(120deg, rgba(20,195,142,.95), rgba(42,139,255,.95)); color: #fff; border-color: transparent; }

#splitter { width: 6px; margin: 0 -4px; cursor: col-resize; border-radius: 6px; flex: none; z-index: 3; }
#splitter:hover, #splitter.drag { background: var(--grad); opacity: .6; }
#side {
  width: 400px; flex: none; min-width: 260px; max-width: 70vw; display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-s); backdrop-filter: blur(16px);
}
#sideTabs { display: flex; gap: 4px; padding: 8px 8px 0; flex: none; }
#sideTabs button {
  flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; border: 0; border-radius: 11px 11px 0 0; cursor: pointer;
  background: var(--panel-2); color: var(--muted); font-weight: 700; font-size: 12.5px;
}
#sideTabs button.on { background: var(--panel-solid); color: var(--text); box-shadow: inset 0 3px 0 0 transparent; position: relative; }
#sideTabs button.on::after { content: ""; position: absolute; left: 10px; right: 10px; top: 0; height: 3px; border-radius: 3px; background: var(--grad); }
.panel { display: none; flex: 1; min-height: 0; flex-direction: column; background: var(--panel-solid); margin: 0 8px 8px; border-radius: 0 0 14px 14px; border: 1px solid var(--line); border-top: 0; overflow: hidden; }
.panel.on { display: flex; }
.phead { display: flex; align-items: center; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--line); flex: none; font-size: 12.5px; }
.phead select { padding: 6px 8px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-solid); font-weight: 600; outline: none; max-width: 190px; }

#consoleOut {
  flex: 1; overflow-y: auto; padding: 12px 14px; font-family: var(--mono); font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  background: linear-gradient(180deg, #14102c, #1b1340); color: #e9e4ff; outline: none;
}
#consoleOut .err { color: #ff8da1; }
#consoleOut .sys { color: #8f86c8; font-style: italic; }
#consoleOut .in { color: #7ff0c2; }
#consoleOut .caret { display: inline-block; width: 8px; height: 15px; background: #ff4fa3; vertical-align: -2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
#consoleInputRow { padding: 10px; border-top: 1px solid var(--line); background: var(--panel-solid); }
#consoleInputRow label { display: block; font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
.inrow { display: flex; gap: 6px; }
#consoleInput { flex: 1; padding: 9px 12px; border-radius: 11px; border: 1px solid var(--accent); background: var(--panel-solid); outline: none; font-family: var(--mono); box-shadow: 0 0 0 3px rgba(106,77,255,.15); }

#varsBody { flex: 1; overflow: auto; padding: 8px 10px 14px; font-size: 13px; }
.frame { margin-bottom: 12px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.frame h5 { margin: 0; padding: 7px 11px; font-size: 12px; letter-spacing: .06em; background: var(--grad-soft); display: flex; justify-content: space-between; }
.frame table { width: 100%; border-collapse: collapse; }
.frame td { padding: 6px 11px; border-top: 1px solid var(--line); vertical-align: top; font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
.frame td:first-child { font-family: var(--font); font-weight: 700; white-space: nowrap; }
.tchip { display: inline-block; padding: 1px 7px; margin-left: 5px; border-radius: 99px; font-size: 10px; font-family: var(--font); font-weight: 800; color: #fff; vertical-align: 1px; }
.tchip.int { background: #6a4dff; } .tchip.real { background: #ff4fa3; } .tchip.bool { background: #19b97a; } .tchip.str { background: #ff9a3c; }
.unset { color: var(--muted); font-style: italic; }
.empty { color: var(--muted); text-align: center; padding: 26px 10px; font-size: 13px; }

#turtleWrap { flex: 1; position: relative; min-height: 0; background: #fff; }
#turtleCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

#codeOut {
  flex: 1; margin: 0; overflow: auto; padding: 12px 14px; font-family: var(--mono); font-size: 12.5px; line-height: 1.55; white-space: pre; tab-size: 4;
  background: linear-gradient(180deg, #14102c, #1b1340); color: #e9e4ff;
}
#codeOut .cl { display: block; }
#codeOut .cl.act { background: rgba(255,79,163,.2); box-shadow: inset 3px 0 0 #ff4fa3; }

/* ---------- finestre ---------- */
#modalRoot .backdrop {
  position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px;
  background: rgba(20, 12, 50, .45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  animation: fade .15s ease-out;
}
@keyframes fade { from { opacity: 0; } }
.modal {
  width: min(560px, 100%); max-height: calc(100dvh - 32px); display: flex; flex-direction: column;
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 30px 80px rgba(30, 10, 90, .45); overflow: hidden;
  animation: pop .18s cubic-bezier(.2,1.2,.4,1);
}
.modal.wide { width: min(860px, 100%); }
@keyframes pop { from { transform: translateY(10px) scale(.97); opacity: 0; } }
.modal header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; position: relative; flex: none; }
.modal header::after { content: ""; position: absolute; left: 20px; right: 20px; bottom: 0; height: 2px; background: var(--grad); opacity: .55; border-radius: 2px; }
.modal header .badge { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: #fff; font-size: 17px; box-shadow: var(--shadow-s); flex: none; }
.modal header .badge svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.modal header h3 { margin: 0; font-size: 17px; font-weight: 800; flex: 1; }
.modal header .x { border: 0; background: transparent; cursor: pointer; width: 32px; height: 32px; border-radius: 10px; color: var(--muted); display: grid; place-items: center; }
.modal header .x:hover { background: rgba(106,77,255,.12); color: var(--text); }
.modal .body { padding: 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.modal footer { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid var(--line); flex: none; align-items: center; }
.modal footer .note { margin-right: auto; font-size: 12.5px; font-weight: 600; max-width: 62%; }
.modal footer .note.bad { color: var(--danger); }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-solid); font-weight: 700; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { color: #fff; border: 0; background: var(--grad); box-shadow: 0 8px 22px rgba(255,79,163,.35); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.07); }
.btn.danger { color: #fff; border: 0; background: var(--stop); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .lbl { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field input[type=text], .field input[type=number], .field select, .field textarea, .inp {
  padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-solid); outline: none; width: 100%;
}
.field textarea { min-height: 84px; resize: vertical; }
.field input.mono, .field textarea.mono { font-family: var(--mono); }
.field input:focus, .field select:focus, .field textarea:focus, .inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(106,77,255,.16); }
.field input.bad { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(239,71,111,.15); }
.field .hint { font-size: 12px; color: var(--muted); line-height: 1.4; }
.field .errmsg { font-size: 12px; color: var(--danger); font-weight: 600; min-height: 0; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > .field { flex: 1; min-width: 130px; }
.check { display: flex; align-items: center; gap: 9px; font-weight: 600; cursor: pointer; user-select: none; }
.check input { width: 18px; height: 18px; accent-color: var(--accent2); }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); gap: 3px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 13px; border-radius: 9px; font-weight: 700; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--grad); color: #fff; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: 30px; height: 30px; border-radius: 10px; cursor: pointer; border: 3px solid transparent; box-shadow: var(--shadow-s); }
.sw.on { border-color: var(--text); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.card {
  border-radius: 14px; border: 2px solid var(--line); padding: 10px; cursor: pointer; background: var(--panel-solid); transition: transform .12s, border-color .15s; text-align: left;
}
.card:hover { transform: translateY(-2px); border-color: var(--accent); }
.card.on { border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(255,79,163,.2); }
.card .prev { height: 54px; border-radius: 10px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 8px; }
.card .prev i { display: block; width: 26px; height: 18px; border-radius: 7px; }
.card b { font-size: 13px; }
.listbox { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; gap: 8px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); }
.item input, .item select { flex: 1; min-width: 0; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-solid); outline: none; }
.item .nm { font-weight: 700; flex: 1; }
.item .meta { color: var(--muted); font-size: 12.5px; }
.kbd { font-family: var(--mono); font-size: 11.5px; padding: 2px 7px; border-radius: 7px; background: var(--panel-2); border: 1px solid var(--line); }
.help h4 { margin: 14px 0 6px; font-size: 14px; }
.help p, .help li { font-size: 13.5px; line-height: 1.55; margin: 4px 0; }
.help code { font-family: var(--mono); background: var(--panel-2); padding: 1px 6px; border-radius: 6px; font-size: 12.5px; }
.help table { border-collapse: collapse; width: 100%; font-size: 13px; }
.help td, .help th { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
.help th { background: var(--grad-soft); }
.colorpick { width: 54px; height: 38px; padding: 2px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-solid); cursor: pointer; }

/* menu contestuali / popover */
#menuRoot .scrim { position: fixed; inset: 0; z-index: 90; }
.menu {
  position: fixed; z-index: 95; min-width: 210px; max-width: 280px; max-height: 70vh; overflow-y: auto; padding: 6px; border-radius: 16px;
  background: var(--panel-solid); border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(40, 20, 120, .35); animation: pop .12s ease-out;
}
.menu .mh { padding: 8px 10px 4px; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
.menu button {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; text-align: left; font-weight: 600; font-size: 13.5px;
}
.menu button:hover, .menu button:focus-visible { background: var(--grad-soft); outline: none; }
.menu button .sc { margin-left: auto; color: var(--muted); font-size: 11.5px; font-family: var(--mono); }
.menu button.danger { color: var(--danger); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 4px; }
.menu .chipic { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-size: 12px; flex: none; }

#toastRoot { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { padding: 10px 18px; border-radius: 14px; background: var(--panel-solid); border: 1px solid var(--line); box-shadow: var(--shadow); font-weight: 700; font-size: 13.5px; animation: pop .2s ease-out; }
.toast.err { background: var(--stop); color: #fff; border: 0; }
.toast.ok { background: var(--go); color: #fff; border: 0; }

.ghost {
  position: fixed; z-index: 120; pointer-events: none; padding: 8px 14px; border-radius: 12px; font-weight: 700; font-size: 13px; color: #fff;
  background: var(--grad); box-shadow: 0 12px 30px rgba(106,77,255,.5); opacity: .92; transform: translate(-50%, -120%);
}
#dropHint { position: fixed; inset: 0; z-index: 150; display: grid; place-items: center; background: rgba(106,77,255,.35); backdrop-filter: blur(8px); }
#dropHint > div { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 30px 44px; border-radius: 26px; background: var(--panel-solid); border: 3px dashed var(--accent2); font-size: 18px; }
#dropHint img { width: 72px; }

.sel-cases .item { align-items: flex-start; }

/* ---------- schermi piccoli ---------- */
@media (max-width: 1580px) { #gFile .tb span { display: none; } #gFile .tb { padding: 0 9px; } }
@media (max-width: 1100px) {
  .tb span { display: none; }
  .tb.go span { display: inline; }
  #palette { width: 180px; }
  #side { width: 340px; }
}
@media (max-width: 820px) {
  body { overflow: auto; overflow-x: hidden; }
  .group { flex-wrap: wrap; max-width: 100%; }
  .speed input { width: 70px; }
  #app { height: auto; min-height: 100dvh; }
  #main { flex-direction: column; }
  #palette { width: 100%; max-height: 190px; }
  #palList { display: flex; gap: 8px; flex-wrap: wrap; align-content: flex-start; }
  .palcat { display: contents; }
  .palcat h4 { display: none; }
  .palitem { margin: 0; }
  #stage { min-height: 70vh; }
  #side { width: 100% !important; max-width: none; min-height: 60vh; }
  #splitter { display: none; }
  .progname { max-width: 100%; width: 100%; }
  .group.right { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media print {
  body * { visibility: hidden; }
}

</style>
</head>

      <div class="brandtext"><b>Algorithm</b><span>Path</span></div>

    <input id="progName" class="progname" spellcheck="false" aria-label="Nome programma">

    <div class="group" id="gFile">
      <button class="tb" id="btnNew" data-tip="Nuovo programma|New program"><i class="ic" data-ic="new"></i><span data-t="Nuovo|New"></span></button>
      <button class="tb" id="btnOpen" data-tip="Apri file .algp|Open .algp file"><i class="ic" data-ic="open"></i><span data-t="Apri|Open"></span></button>
      <button class="tb" id="btnSave" data-tip="Salva (Ctrl+S)|Save (Ctrl+S)"><i class="ic" data-ic="save"></i><span data-t="Salva|Save"></span></button>
    </div>
    <div class="group" id="gEdit">
      <button class="tb icon" id="btnUndo" data-tip="Annulla (Ctrl+Z)|Undo (Ctrl+Z)"><i class="ic" data-ic="undo"></i></button>
      <button class="tb icon" id="btnRedo" data-tip="Ripristina (Ctrl+Y)|Redo (Ctrl+Y)"><i class="ic" data-ic="redo"></i></button>
    </div>

    <div class="group run" id="gRun">
      <button class="tb go" id="btnRun" data-tip="Esegui (F5)|Run (F5)"><i class="ic" data-ic="play"></i><span data-t="Esegui|Run"></span></button>
      <button class="tb icon" id="btnStep" data-tip="Passo successivo (F10)|Next step (F10)"><i class="ic" data-ic="step"></i></button>
      <button class="tb icon" id="btnPause" data-tip="Pausa|Pause"><i class="ic" data-ic="pause"></i></button>
      <button class="tb icon stop" id="btnStop" data-tip="Ferma (Maiusc+F5)|Stop (Shift+F5)"><i class="ic" data-ic="stop"></i></button>
      <label class="speed" data-tip="Velocità di esecuzione|Run speed"><i class="ic" data-ic="gauge"></i><input type="range" id="speed" min="0" max="5" step="1" value="5"><b id="speedLabel"></b></label>
    </div>

    <div class="group right" id="gRight">
      <button class="tb icon" id="btnFuncs" data-tip="Funzioni|Functions"><i class="ic" data-ic="func"></i></button>
      <button class="tb icon" id="btnExport" data-tip="Esporta immagine / Stampa|Export image / Print"><i class="ic" data-ic="image"></i></button>
      <button class="tb icon" id="btnInfo" data-tip="Informazioni sul programma|Program info"><i class="ic" data-ic="info"></i></button>
      <button class="tb icon" id="btnSettings" data-tip="Impostazioni e temi|Settings & themes"><i class="ic" data-ic="palette"></i></button>
      <button class="tb icon" id="btnHelp" data-tip="Guida|Help"><i class="ic" data-ic="help"></i></button>
    </div>
  </header>

  <div id="main">
    <aside id="palette">
      <div class="palhead">
        <input id="palSearch" type="search" data-ph="Cerca blocco…|Search block…" autocomplete="off">
      </div>
      <div id="palList"></div>
      <div class="palfoot" data-t="Clic per aggiungere, oppure trascina sul diagramma. Doppio clic su un blocco per modificarlo.|Click to add, or drag onto the chart. Double-click a block to edit it."></div>
    </aside>

    <section id="stage">
      <div id="tabs"></div>
      <div id="viewport"><div id="chartHost"></div></div>

<script>
'use strict';
/* Algorithm Path - nucleo: lingua, valori tipizzati, formattazione numeri, errori */
window.AP = window.AP || {};
(function (AP) {
  AP.lang = 'it';
  AP.tr = function (it, en) { return AP.lang === 'en' ? en : it; };

  var uidCounter = 0;
  AP.uid = function () {
    uidCounter++;
    return 'n' + Date.now().toString(36) + uidCounter.toString(36) + Math.floor(Math.random() * 46656).toString(36);
  };

  AP.esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  AP.clone = function (o) { return JSON.parse(JSON.stringify(o)); };

  // ---- Tipi ----
  AP.TYPES = ['int', 'real', 'bool', 'str'];
  AP.typeName = function (t, plural) {
    var m = {
      int: AP.tr('Intero', 'Integer'), real: AP.tr('Reale', 'Real'),
      bool: AP.tr('Booleano', 'Boolean'), str: AP.tr('Stringa', 'String'), none: AP.tr('Nessuno', 'None')
    };
    return m[t] || m.none;
  };

  // ---- Valori ----
  // scalare: {t, v}  (v === null => non inizializzato)   array: {t, arr:[valori]}
  AP.V = {
    int: function (n) { return { t: 'int', v: Math.trunc(n) }; },
    real: function (n) { return { t: 'real', v: n }; },
    bool: function (b) { return { t: 'bool', v: !!b }; },
    str: function (s) { return { t: 'str', v: String(s) }; },
    none: function (t) { return { t: t, v: null }; },
    array: function (t, n) {
      var a = [];
      for (var i = 0; i < n; i++) a.push({ t: t, v: null });
      return { t: t, arr: a };
    }
  };
  AP.isArr = function (x) { return !!x && x.arr !== undefined; };
  AP.isNum = function (x) { return !AP.isArr(x) && (x.t === 'int' || x.t === 'real') && x.v !== null; };
  AP.isStr = function (x) { return !AP.isArr(x) && x.t === 'str' && x.v !== null; };
  AP.isBool = function (x) { return !AP.isArr(x) && x.t === 'bool' && x.v !== null; };
  AP.valType = function (x) {
    if (!x) return AP.tr('Nessuno', 'None');
    var n = AP.typeName(x.t);
    return AP.isArr(x) ? n + AP.tr(' (array)', ' array') : n;
  };

  // Formattazione dei reali in stile .NET (15 cifre significative)
  AP.fmtReal = function (n) {
    if (Number.isNaN(n)) return 'NaN';
    if (!isFinite(n)) return n > 0 ? 'Infinity' : '-Infinity';
    if (n === 0) return '0';
    var p = Number(n.toPrecision(15));
    var a = Math.abs(p);
    if (a >= 1e15 || a < 1e-5) {
      var s = p.toExponential().split('e');
      var sign = s[1][0];
      var d = s[1].slice(1);
      if (d.length < 2) d = '0' + d;
      return s[0] + 'E' + sign + d;
    }
    return String(p);
  };

  AP.valText = function (x) {
    if (!x) return '';
    if (AP.isArr(x)) return '[...]';
    if (x.v === null) return '';
    switch (x.t) {
      case 'bool': return x.v ? 'true' : 'false';
      case 'int': return String(Math.trunc(x.v));
      case 'real': return AP.fmtReal(x.v);
      default: return String(x.v);
    }
  };

  AP.canConvertReal = function (text) {
    if (text == null) return false;
    text = String(text).trim();
    return /^[+-]?(\d+\.?\d*|\.\d+)$/.test(text) && !/\.$/.test(text);
  };

  // ---- Errori ----
  function RunError(msg) { this.message = msg; this.name = 'RunError'; this.stmt = null; }
  RunError.prototype = Object.create(Error.prototype);
  AP.RunError = RunError;
  AP.err = function (it, en) { return new RunError(AP.tr(it, en)); };

  // segnali di controllo flusso
  AP.BreakSig = function () { };
  AP.ContinueSig = function () { };
  AP.ReturnSig = function (value) { this.value = value; };
  AP.ExitSig = function () { };
  AP.GotoSig = function (label) { this.label = label; };
  AP.StopSig = function () { };

  AP.sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  AP.download = function (name, data, mime) {
    var blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'text/plain;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };

  AP.store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
  };
})(window.AP);

<script>
'use strict';
/* Algorithm Path - analizzatore delle espressioni (lessico + sintassi) */
(function (AP) {
  var tr = AP.tr;

  var BUILTIN = {
    abs: 1, arcsin: 1, arccos: 1, arctan: 1, char: 1, cos: 1, int: 1, len: 1, log: 1, ln: 1, log10: 1,
    tofixed: 1, random: 1, sin: 1, size: 1, sgn: 1, sqrt: 1, tan: 1, tochar: 1, tocode: 1, tointeger: 1,
    toreal: 1, tostring: 1, eof: 1, turtlex: 1, turtley: 1
  };
  AP.BUILTIN = BUILTIN;

  var WORDOPS = { or: 'or', and: 'and', not: 'not', mod: '%' };
  var SYMBOLS = [
    ['||', 'or'], ['∨', 'or'], ['&&', 'and'], ['∧', 'and'],
    ['<=', '<='], ['≤', '<='], ['>=', '>='], ['≥', '>='], ['==', '='], ['!=', '!='], ['<>', '!='], ['≠', '!='],
    ['<', '<'], ['>', '>'], ['=', '='], ['&', '&'], ['+', '+'], ['-', '-'], ['−', '-'],
    ['*', '*'], ['×', '*'], ['∗', '*'], ['/', '/'], ['÷', '/'], ['⁄', '/'], ['∕', '/'], ['%', '%'],
    ['^', '^'], ['↑', '^'], ['⭡', '^'], ['!', 'not'], ['¬', 'not'],
    ['(', '('], [')', ')'], ['[', '['], [']', ']'], [',', ',']
  ];
  SYMBOLS.sort(function (a, b) { return b[0].length - a[0].length; });

  function ParseError(msg) { this.message = msg; }

  function isLetter(c) { return /[A-Za-z_À-ɏͰ-ϿЀ-ӿ一-鿿぀-ヿ가-힯]/.test(c); }
  function isDigit(c) { return c >= '0' && c <= '9'; }

  function tokenize(text) {
    var toks = [], i = 0, n = text.length;
    while (i < n) {
      var c = text[i];
      if (/\s/.test(c)) { i++; continue; }
      if (isLetter(c)) {
        var j = i;
        while (j < n && (isLetter(text[j]) || isDigit(text[j]))) j++;
        var w = text.slice(i, j), lw = w.toLowerCase();
        i = j;
        if (WORDOPS[lw]) toks.push({ k: 'op', v: WORDOPS[lw], w: w });
        else toks.push({ k: 'id', v: w });
        continue;
      }
      if (c === '"') {
        var j2 = i + 1;
        while (j2 < n && text[j2] !== '"' && text[j2] !== '\n') j2++;
        if (text[j2] !== '"') throw new ParseError(tr('Stringa non chiusa: manca il carattere "', 'Unterminated string: missing closing "'));
        toks.push({ k: 'str', v: text.slice(i + 1, j2) });
        i = j2 + 1;
        continue;
      }
      if (isDigit(c) || c === '.') {
        var j3 = i;
        while (j3 < n && (isDigit(text[j3]) || text[j3] === '.')) j3++;
        var num = text.slice(i, j3);
        if (!/^(\d+(\.\d+)?|\.\d+)$/.test(num)) throw new ParseError(tr('Numero non valido: ', 'Invalid number: ') + num);
        toks.push({ k: 'num', v: num });
        i = j3;
        continue;
      }
      var found = null;
      for (var s = 0; s < SYMBOLS.length; s++) {
        if (text.substr(i, SYMBOLS[s][0].length) === SYMBOLS[s][0]) { found = SYMBOLS[s]; break; }
      }
      if (!found) throw new ParseError(tr('Carattere non riconosciuto: ', 'Unrecognized character: ') + c);
      var v = found[1];
      toks.push({ k: (v === '(' || v === ')' || v === '[' || v === ']' || v === ',') ? v : 'op', v: v });
      i += found[0].length;
    }
    return toks;
  }

  function parseTokens(toks) {
    var i = 0;
    function peek() { return toks[i]; }
    function isOp(v) { var t = toks[i]; return t && t.k === 'op' && t.v === v; }
    function unexpected() {

      if (!t) return new ParseError(tr('Espressione incompleta', 'Incomplete expression'));
      var txt = t.k === 'str' ? '"' + t.v + '"' : (t.w || t.v);

    function bin(op, l, r) { return { k: 'bin', op: op, l: l, r: r, hasCall: l.hasCall || r.hasCall }; }

    function parseOr() { var l = parseAnd(); while (isOp('or')) { i++; l = bin('or', l, parseAnd()); } return l; }
    function parseAnd() { var l = parseCmp(); while (isOp('and')) { i++; l = bin('and', l, parseCmp()); } return l; }
    function parseCmp() {
      var l = parseCat();
      for (;;) {
        var t = peek();
        if (t && t.k === 'op' && ['<', '>', '<=', '>=', '=', '!='].indexOf(t.v) >= 0) { i++; l = bin(t.v, l, parseCat()); } else break;
      }

      for (;;) {
        if (isOp('+')) { i++; l = bin('+', l, parseMul()); }
        else if (isOp('-')) { i++; l = bin('-', l, parseMul()); } else break;
      }
      return l;
    }
    function parseMul() {
      var l = parsePow();
      for (;;) {
        if (isOp('*')) { i++; l = bin('*', l, parsePow()); }
        else if (isOp('/')) { i++; l = bin('/', l, parsePow()); }
        else if (isOp('%')) { i++; l = bin('%', l, parsePow()); } else break;
      }
      return l;
    }
    function parsePow() { var l = parseUnary(); while (isOp('^')) { i++; l = bin('^', l, parseUnary()); } return l; }
    function parseUnary() {
      if (isOp('-')) { i++; var e = parseUnary(); return { k: 'un', op: 'neg', e: e, hasCall: e.hasCall }; }
      if (isOp('not')) { i++; var e2 = parseUnary(); return { k: 'un', op: 'not', e: e2, hasCall: e2.hasCall }; }
      return parsePrimary();
    }
    function parsePrimary() {
      var t = peek();
      if (!t) throw unexpected();
      if (t.k === 'num') {
        i++;
        return { k: 'lit', val: t.v.indexOf('.') >= 0 ? AP.V.real(parseFloat(t.v)) : AP.V.int(parseInt(t.v, 10)), hasCall: false };
      }

      }

        if (nx && nx.k === '(') {
          i++;

          if (peek() && peek().k === ')') { i++; }
          else {
            for (;;) {
              args.push(parseOr());
              if (peek() && peek().k === ',') { i++; continue; }
              if (peek() && peek().k === ')') { i++; break; }

            }

          if (!peek() || peek().k !== ']') throw peek() ? unexpected() : new ParseError(tr('Parentesi quadra non chiusa', 'Missing closing bracket'));

        }

        if (lname === 'false') return { k: 'lit', val: AP.V.bool(false), hasCall: false };
        if (lname === 'pi' || lname === 'π') return { k: 'const', name: 'pi', hasCall: false };
        if (lname === 'time') return { k: 'const', name: 'time', hasCall: false };
        if (lname === 'lf') return { k: 'const', name: 'lf', hasCall: false };
        return { k: 'var', name: t.v, lname: lname, idx: null, hasCall: false };
      }
      throw unexpected();
    }

    if (!toks.length) throw new ParseError(tr('Espressione vuota', 'Empty expression'));
    var r = parseOr();
    if (i < toks.length) throw unexpected();
    return r;
  }

  // Restituisce {ok, ast, error}
  AP.parseExpr = function (text) {

        if (ast.op === 'or' && AP.isBool(l) && l.v) return l;
        var r = await this.evalA(ast.r, env);
        return binop(ast.op, l, r);
      case 'call':
        if (ast.user) return await this.callUser(ast, env, true);
        var args = [];
        for (var i = 0; i < ast.args.length; i++) args.push(await this.evalA(ast.args[i], env));
        return this.builtin(ast, args);
    }
    return this.evalS(ast, env);
  };

  Interp.prototype.ev = function (text, env) {
    var p = AP.expr(text);
    if (!p.ok) throw AP.err('Espressione non valida "' + text + '": ' + p.error, 'Invalid expression "' + text + '": ' + p.error);
    return p.ast.hasCall ? this.evalA(p.ast, env) : this.evalS(p.ast, env);
  };

  // ----- funzioni utente -----
  Interp.prototype.callUser = async function (ast, env, valueRequired) {
    var fn = M.getFunc(this.prog, ast.name);
    if (!fn || fn.isMain) throw AP.err('La funzione "' + ast.name + '" non è definita', 'Function "' + ast.name + '" is not defined');
    if (valueRequired && fn.ret === 'none') throw AP.err('La funzione "' + fn.name + '" non restituisce alcun valore', 'Function "' + fn.name + '" returns no value');
    if (ast.args.length !== fn.params.length) throw AP.err('La funzione "' + fn.name + '" richiede ' + fn.params.length + ' argomento/i (trovati ' + ast.args.length + ')', 'Function "' + fn.name + '" needs ' + fn.params.length + ' argument(s) (found ' + ast.args.length + ')');
    var vals = [];
    for (var i = 0; i < fn.params.length; i++) {
      var p = fn.params[i], a = ast.args[i];
      var v = await this.evalA(a, env);
      if (p.arr) {
        if (!AP.isArr(v) || v.t !== p.type) throw AP.err('Il parametro "' + p.name + '" richiede un array di tipo ' + AP.typeName(p.type), 'Parameter "' + p.name + '" needs an array of ' + AP.typeName(p.type));
        vals.push(v); // per riferimento
      } else {
        if (AP.isArr(v)) throw AP.err('Il parametro "' + p.name + '" non accetta un array', 'Parameter "' + p.name + '" does not accept an array');
        vals.push(convertTo(p.type, v, p.name));
      }
    }
    return await this.runFunction(fn, vals);
  };

  Interp.prototype.runFunction = async function (fn, vals) {
    if (this.frames.length > 1500) throw AP.err('Troppe chiamate annidate: ricorsione infinita?', 'Too many nested calls: infinite recursion?');
    var env = new Env(null);
    var frame = { fn: fn, name: fn.name, env: env, stmt: null };
    if (fn.isMain) this.mainEnv = env;
    this.frames.push(frame);
    try {
      for (var i = 0; i < fn.params.length; i++) env.declare(fn.params[i].name, fn.params[i].type, vals[i]);
      var rv = null;
      if (fn.ret !== 'none' && fn.retVar && fn.retVar.trim()) {
        rv = env.declare(fn.retVar.trim(), fn.ret, V.none(fn.ret));
        rv.auto = true;
      }
      var retVal = null;
      try {
        await this.execBlock(fn.body, env);
      } catch (e) {
        if (e instanceof AP.ReturnSig) retVal = e.value;
        else if (e instanceof AP.BreakSig || e instanceof AP.ContinueSig) throw AP.err('Break/Continue fuori da un ciclo', 'Break/Continue outside a loop');
        else if (e instanceof AP.GotoSig) throw AP.err('Etichetta :' + e.label + ' non trovata', 'Label :' + e.label + ' not found');
        else throw e;
      }
      if (fn.ret === 'none') return null;
      if (retVal) return convertTo(fn.ret, retVal, fn.name);
      var rvar = rv ? rv.val : null;
      if (!rvar || rvar.v === null) throw AP.err('La funzione "' + fn.name + '" non ha assegnato alcun valore di ritorno', 'Function "' + fn.name + '" did not assign a return value');
      return convertTo(fn.ret, rvar, fn.name);
    } finally {
      this.frames.pop();
    }
  };

  // ----- esecuzione blocchi -----
  Interp.prototype.locate = function (list, label) {
    label = M.normLabel(label).toLowerCase();
    for (var i = 0; i < list.length; i++) {
      var s = list[i];
      if (s.type === 'label' && M.normLabel(s.name).toLowerCase() === label) return { idx: i, direct: true };
      var ch = M.childLists(s);
      for (var j = 0; j < ch.length; j++) if (M.hasLabel(ch[j], label)) return { idx: i, direct: false };
    }
    return null;
  };

  // Esegue un blocco; supporta i salti Goto verso etichette di questo blocco (anche dentro blocchi annidati)
  Interp.prototype.execBlock = async function (list, env, entry) {
    var i = 0, target = entry || null;
    for (;;) {
      try {
        if (target) {
          var loc = this.locate(list, target);
          var lab = target; target = null;
          if (!loc) throw new AP.GotoSig(lab);
          if (loc.direct) i = loc.idx + 1;
          else { await this.exec(list[loc.idx], env, lab); i = loc.idx + 1; }
        }
        for (; i < list.length; i++) await this.exec(list[i], env);
        return;
      } catch (e) {
        if (e instanceof AP.GotoSig && this.locate(list, e.label)) { target = e.label; continue; }
        throw e;
      }
    }
  };

  Interp.prototype.assignTo = function (targetText, val, env) {
    var t = AP.parseTarget(targetText);
    if (!t.ok) throw AP.err(t.error, t.error);
    var v = this.lookup(env, t.name);
    if (v.locked) throw AP.err('"' + v.name + '" è una costante e non può essere modificata', '"' + v.name + '" is a constant and cannot be changed');
    return t;
  };

  Interp.prototype.storeVar = async function (targetText, val, env) {
    var t = this.assignTo(targetText, val, env);
    var v = env.get(t.lname);
    if (t.idxText !== null) {
      if (!AP.isArr(v.val)) throw AP.err('"' + t.name + '" non è un array', '"' + t.name + '" is not an array');
      var iv = await this.ev(t.idxText, env);
      if (!AP.isNum(iv)) throw AP.err('L\'indice di "' + t.name + '" deve essere un numero', 'The index of "' + t.name + '" must be a number');
      var i = Math.trunc(iv.v);
      if (i < 0 || i >= v.val.arr.length) throw AP.err('Indice ' + i + ' fuori dai limiti di "' + t.name + '" (massimo ' + (v.val.arr.length - 1) + ')', 'Index ' + i + ' is out of range for "' + t.name + '" (max ' + (v.val.arr.length - 1) + ')');
      var cv = convertTo(v.val.t, val, t.name + '[' + i + ']');
      v.val.arr[i].v = cv.v;
    } else {
      if (AP.isArr(v.val)) throw AP.err('"' + t.name + '" è un array: serve un indice', '"' + t.name + '" is an array: an index is needed');
      var c = convertTo(v.t, val, t.name);
      v.val.v = c.v;
    }
  };

  Interp.prototype.cond = async function (text, env, what) {
    var v = await this.ev(text, env);
    if (!AP.isBool(v)) throw AP.err(what + ': la condizione deve essere booleana (trovato ' + AP.valType(v) + (AP.isArr(v) ? '' : ' "' + AP.valText(v) + '"') + ')', what + ': the condition must be Boolean (found ' + AP.valType(v) + ')');
    return v.v;
  };

  Interp.prototype.exec = async function (s, env, entry) {
    var h = this.host;
    try {
      await this.tick(s, env);
      switch (s.type) {
        case 'declare': return this.doDeclare(s, env);
        case 'assign':
          var v = await this.ev(s.expr, env);
          return await this.storeVar(s.target, v, env);
        case 'input': return await this.doInput(s, env);
        case 'output':
          var o = await this.ev(s.expr, env);
          if (AP.isArr(o)) throw AP.err('Impossibile scrivere un array intero', 'Cannot print a whole array');
          if (o.v === null) throw AP.err('Il valore da scrivere non è inizializzato', 'The value to print is not initialized');
          var txt = AP.valText(o);
          this.lastOut = txt;
          h.print(txt, s.nl);
          return;
        case 'call':
          var pc = AP.expr(s.expr);
          if (!pc.ok) throw AP.err(pc.error, pc.error);
          if (pc.ast.k !== 'call') throw AP.err('Il blocco Chiama richiede una chiamata di funzione, per esempio Nome(x)', 'The Call block needs a function call, e.g. Name(x)');
          if (pc.ast.user) await this.callUser(pc.ast, env, false);
          else await this.evalA(pc.ast, env);
          return;
        case 'if':
          if (entry) return await this.execBlock(M.hasLabel(s.yes, entry) ? s.yes : s.no, new Env(env), entry);
          return await this.execBlock(await this.cond(s.cond, env, 'Se') ? s.yes : s.no, new Env(env));
        case 'while':
          var wf = entry;
          while (wf || await this.cond(s.cond, env, 'Mentre')) {
            var we = wf; wf = null;
            try { await this.execBlock(s.body, new Env(env), we); }
            catch (e) { if (e instanceof AP.ContinueSig) { } else if (e instanceof AP.BreakSig) break; else throw e; }
            await this.tick(s, env);
          }
          return;
        case 'do':
          var df = entry;
          do {
            var de = df; df = null;
            try { await this.execBlock(s.body, new Env(env), de); }
            catch (e) { if (e instanceof AP.ContinueSig) { } else if (e instanceof AP.BreakSig) break; else throw e; }
            await this.tick(s, env);
            var c = await this.cond(s.cond, env, 'Ripeti');
            if (s.until ? c : !c) break;
          } while (true);
          return;
        case 'for': return await this.doFor(s, env, entry);
        case 'label': return;
        case 'goto': throw new AP.GotoSig(s.name);
        case 'comment': case 'breakpoint': return;
        case 'sleep': return await this.doSleep(s, env);
        case 'assert':
          if (!await this.cond(s.cond, env, 'Verifica')) throw AP.err('Verifica fallita: ' + (s.msg || s.cond), 'Assertion failed: ' + (s.msg || s.cond));
          return;
        case 'break': throw new AP.BreakSig();
        case 'continue': throw new AP.ContinueSig();
        case 'exit': throw new AP.ExitSig();
        case 'return':
          if (s.expr.trim()) {
            var fr = this.frames[this.frames.length - 1];
            if (fr && fr.fn.ret === 'none' && !fr.fn.isMain) throw AP.err('Questa funzione non restituisce valori', 'This function returns no value');
            throw new AP.ReturnSig(await this.ev(s.expr, env));
          }
          throw new AP.ReturnSig(null);
        case 'arrayop': return await this.doArrayOp(s, env);
        case 'switch': return await this.doSwitch(s, env, entry);
        case 'try': return await this.doTry(s, env, entry);
        case 'turtle': return await this.doTurtle(s, env);
      }
    } catch (e) {
      if (e instanceof AP.RunError && !e.stmt) e.stmt = s;
      throw e;
    }
  };

  Interp.prototype.doSleep = async function (s, env) {
    var v = await this.ev(s.secs, env);
    if (!AP.isNum(v) || v.v < 0) throw AP.err('Attendi: serve un numero di secondi non negativo (trovato ' + AP.valText(v) + ')', 'Wait: a non-negative number of seconds is needed (found ' + AP.valText(v) + ')');
    var end = Date.now() + v.v * 1000;
    while (!this.stopFlag) {
      var left = end - Date.now();
      if (left <= 0) break;
      await AP.sleep(Math.min(left, 50));
    }
    if (this.stopFlag) throw new AP.StopSig();
  };

  Interp.prototype.doDeclare = async function (s, env) {
    var names = s.names.split(',').map(function (x) { return x.trim(); }).filter(Boolean);
    for (var i = 0; i < names.length; i++) {
      var n = names[i];
      var old = env.vars.get(n.toLowerCase());
      if (old && !old.auto) throw AP.err('La variabile "' + n + '" è già stata dichiarata', 'Variable "' + n + '" has already been declared');
      var val;
      if (s.isArr) {
        var sz = await this.ev(s.size, env);
        if (!AP.isNum(sz) || sz.v < 0 || sz.v > 10000000) throw AP.err('Dimensione dell\'array non valida: ' + AP.valText(sz), 'Invalid array size: ' + AP.valText(sz));
        val = V.array(s.vtype, Math.trunc(sz.v));
      } else {
        val = V.none(s.vtype);
      }
      var variable;
      if (old && old.auto) { old.auto = false; old.t = s.vtype; old.val = val; variable = old; }
      else variable = env.declare(n, s.vtype, val, false);
      if (s.isConst && !s.isArr) {
        var cv = await this.ev(s.value, env);
        var conv = convertTo(s.vtype, cv, n);
        val.v = conv.v;
        variable.locked = true;
      }
    }
  };

  Interp.prototype.parseInput = function (text, t) {
    text = text.trim();
    switch (t) {
      case 'int': if (!AP.canConvertReal(text)) return null; return V.int(parseFloat(text));
      case 'real': if (!AP.canConvertReal(text)) return null; return V.real(parseFloat(text));
      case 'bool':
        var l = text.toLowerCase();
        if (l === 'true' || l === 'vero') return V.bool(true);
        if (l === 'false' || l === 'falso') return V.bool(false);
        return null;
    }
    return V.str(text);
  };

  Interp.prototype.doInput = async function (s, env) {
    var t = AP.parseTarget(s.target);
    if (!t.ok) throw AP.err(t.error, t.error);
    var v = this.lookup(env, t.name);
    var vt = v.t;
    for (;;) {
      var raw = await this.host.input(s.target, vt);
      if (raw === null || this.stopFlag) throw new AP.StopSig();
      var val = vt === 'str' ? V.str(raw) : this.parseInput(raw, vt);
      if (val) { await this.storeVar(s.target, val, env); return; }
      this.host.inputError(tr('Valore non valido per il tipo ', 'Invalid value for type ') + AP.typeName(vt) + ': "' + raw + '"');
    }
  };

  Interp.prototype.doFor = async function (s, env, entry) {
    var self = this;
    var vr = this.lookup(env, s.v);
    var start = await this.ev(s.start, env), end = await this.ev(s.end, env), step = await this.ev(s.step, env);
    var names = [['Inizio', 'Start', start], ['Fine', 'End', end], ['Passo', 'Step', step]];
    names.forEach(function (n) { if (!AP.isNum(n[2])) throw AP.err('Per: il valore ' + n[0] + ' deve essere numerico (trovato ' + AP.valType(n[2]) + ')', 'For: the ' + n[1] + ' value must be numeric (found ' + AP.valType(n[2]) + ')'); });
    if (step.v === 0) throw AP.err('Per: il passo non può essere zero', 'For: the step cannot be zero');
    if (step.v < 0) throw AP.err('Per: il passo deve essere positivo (usa la direzione "decrescente")', 'For: the step must be positive (use the "decreasing" direction)');
    var dec = s.dir === 'dec';
    var cur = start.v, ff = entry;
    if (ff && AP.isNum(vr.val)) cur = vr.val.v;
    for (;;) {
      if (!ff) {
        var more = dec ? cur >= end.v : cur <= end.v;
        var cv = convertTo(vr.t, V.real(cur), s.v);
        vr.val.v = cv.v;
        if (!more) break;
      }
      var fe = ff; ff = null;
      try { await this.execBlock(s.body, new Env(env), fe); }
      catch (e) { if (e instanceof AP.ContinueSig) { } else if (e instanceof AP.BreakSig) break; else throw e; }
      await this.tick(s, env);
      cur = AP.isNum(vr.val) ? vr.val.v : cur;
      cur = dec ? cur - step.v : cur + step.v;
    }
  };

  Interp.prototype.doArrayOp = async function (s, env) {
    var o = M.arrayOp(s.op);
    var av = this.lookup(env, s.array);
    var arr = av.val;
    if (!AP.isArr(arr)) throw AP.err('"' + s.array + '" non è un array', '"' + s.array + '" is not an array');
    if (o.mutates && av.locked) throw AP.err('"' + s.array + '" è una costante', '"' + s.array + '" is a constant');
    var idx = null, value = null;
    if (o.needIdx) {
      var iv = await this.ev(s.index, env);
      if (!AP.isNum(iv)) throw AP.err('L\'indice deve essere un numero', 'The index must be a number');
      idx = Math.trunc(iv.v);
    }
    if (o.needVal) value = await this.ev(s.value, env);
    var store = async function (self, v) { await self.storeVar(s.target, v, env); };
    switch (s.op) {
      case 'append': case 'insert':
        var pos = arr.arr.length;
        if (s.op === 'insert') {
          if (idx < 0 || idx > arr.arr.length) throw AP.err('Indice ' + idx + ' fuori dai limiti (0-' + arr.arr.length + ')', 'Index ' + idx + ' is out of range (0-' + arr.arr.length + ')');
          pos = idx;
        }
        arr.arr.splice(pos, 0, convertTo(arr.t, value, s.array));
        return;
      case 'remove':
        if (idx < 0 || idx >= arr.arr.length) throw AP.err('Indice ' + idx + ' fuori dai limiti (0-' + (arr.arr.length - 1) + ')', 'Index ' + idx + ' is out of range (0-' + (arr.arr.length - 1) + ')');
        arr.arr.splice(idx, 1);
        return;
      case 'length': return await store(this, V.int(arr.arr.length));
      case 'search':
        var found = -1;
        for (var i = 0; i < arr.arr.length && found === -1; i++) {
          var el = arr.arr[i];
          if (el.v !== null && !AP.isArr(value) && ((AP.isNum(el) && AP.isNum(value)) || el.t === value.t) && compare(el, value) === 0) found = i;
        }
        return await store(this, V.int(found));
    }
    for (var k = 0; k < arr.arr.length; k++) if (arr.arr[k].v === null) throw AP.err('L\'elemento ' + s.array + '[' + k + '] non ha un valore', 'Element ' + s.array + '[' + k + '] has no value');
    if (s.op === 'sort') {
      var items = arr.arr.slice();
      items.sort(function (a, b) { return s.desc ? compare(b, a) : compare(a, b); });
      for (var m = 0; m < items.length; m++) arr.arr[m] = items[m];
      return;
    }
    if (!arr.arr.length) throw AP.err('L\'array "' + s.array + '" è vuoto', 'Array "' + s.array + '" is empty');
    var best = arr.arr[0];
    for (var j = 1; j < arr.arr.length; j++) {
      var cmp = compare(arr.arr[j], best);
      if ((s.op === 'min' && cmp < 0) || (s.op === 'max' && cmp > 0)) best = arr.arr[j];
    }
    return await store(this, best);
  };

  function compare(a, b) {
    if (AP.isNum(a) && AP.isNum(b)) return a.v < b.v ? -1 : a.v > b.v ? 1 : 0;
    if (AP.isBool(a) && AP.isBool(b)) return a.v === b.v ? 0 : (a.v ? 1 : -1);
    var x = AP.valText(a), y = AP.valText(b);
    return x < y ? -1 : x > y ? 1 : 0;
  }

  function valuesMatch(a, b) {
    if (AP.isArr(a) || AP.isArr(b) || a.v === null || b.v === null) return false;
    if (AP.isNum(a) && AP.isNum(b)) return a.v === b.v;
    if (AP.isBool(a) && AP.isBool(b)) return a.v === b.v;
    return AP.valText(a) === AP.valText(b);
  }

  Interp.prototype.doSwitch = async function (s, env, entry) {
    if (entry) {
      var pick = s.dflt;
      s.cases.forEach(function (c) { if (M.hasLabel(c.body, entry)) pick = c.body; });
      return await this.execBlock(pick, new Env(env), entry);
    }
    var subject = await this.ev(s.expr, env);
    if (AP.isArr(subject) || subject.v === null) throw AP.err('Scelta: il valore da confrontare non è valido', 'Switch: the subject value is not valid');
    var chosen = s.dflt;
    outer:
    for (var i = 0; i < s.cases.length; i++) {
      var vals = M.splitValues(s.cases[i].values);
      for (var j = 0; j < vals.length; j++) {
        if (valuesMatch(subject, await this.ev(vals[j], env))) { chosen = s.cases[i].body; break outer; }
      }
    }
    return await this.execBlock(chosen, new Env(env));
  };

  Interp.prototype.doTry = async function (s, env, entry) {
    var depth = this.frames.length;
    if (entry && !M.hasLabel(s.body, entry)) {
      var he = new Env(env);
      if (s.errVar && s.errVar.trim()) he.declare(s.errVar.trim(), 'str', V.str(''));
      return await this.execBlock(s.handler, he, entry);
    }
    try {
      await this.execBlock(s.body, new Env(env), entry);
    } catch (e) {
      if (!(e instanceof AP.RunError)) throw e;
      while (this.frames.length > depth) this.frames.pop();
      var henv = new Env(env);
      if (s.errVar && s.errVar.trim()) {
        henv.declare(s.errVar.trim(), 'str', V.str(e.message));
      }
      await this.execBlock(s.handler, henv);
    }
  };

  Interp.prototype.doTurtle = async function (s, env) {
    var T = this.host.turtle;
    if (!T) throw AP.err('Finestra tartaruga non disponibile', 'Turtle window not available');
    var o = M.turtleOp(s.op);
    var txts = [s.a, s.b, s.c], vals = [];
    for (var i = 0; i < o.n; i++) {
      var v = await this.ev(txts[i], env);
      if (s.op === 'text' && i === 0) {
        if (AP.isArr(v) || v.v === null) throw AP.err('Tartaruga: testo non valido', 'Turtle: invalid text');
        vals.push(AP.valText(v));
      } else {
        if (!AP.isNum(v)) throw AP.err('Tartaruga: il valore ' + (i + 1) + ' deve essere numerico (trovato ' + AP.valType(v) + ')', 'Turtle: value ' + (i + 1) + ' must be numeric (found ' + AP.valType(v) + ')');
        vals.push(v.v);
      }
    }
    var p = T.exec(s.op, vals, !!s.flag, s);
    if (p && p.then) await p;
  };

  // ----- avvio -----
  Interp.prototype.precheck = function () {
    var self = this, bad = null;
    this.prog.funcs.forEach(function (f) {
      M.walk(f.body, function (st) {
        if (bad) return false;
        var e = M.check(st) || M.checkLinks(f, st);
        if (e) { bad = { stmt: st, msg: e, func: f }; return false; }
      });
    });
    return bad;
  };

  Interp.prototype.run = async function () {
    var host = this.host;
    this.state = 'running';
    if (host.onState) host.onState('running');
    var result = 'finished';
    try {
      var main = this.prog.funcs[0];
      await this.runFunction(main, []);
    } catch (e) {
      if (e instanceof AP.ExitSig || e instanceof AP.ReturnSig) { }
      else if (e instanceof AP.StopSig) result = 'stopped';

<script>
