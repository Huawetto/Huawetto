    if (!S.sel) return null;
    return M.find(S.prog, S.sel);
  }

  function needsDialog(type) { return ['break', 'continue', 'exit', 'breakpoint'].indexOf(type) < 0; }
  A.needsDialog = needsDialog;

  A.insertStmt = function (stmt, list, idx) {
    A.pushUndo();
    list.splice(idx, 0, stmt);
    S.sel = stmt.id;
    A.mark(); A.refreshAll();
    var el = $('chartHost').querySelector('.blk[data-id="' + stmt.id + '"]');
    if (el) A.scrollTo(el);
  };

  A.addStmt = function (type, listId, idx) {
    if (!A.canEdit()) return;
    var list = AP.getList(S.prog, listId);
    if (!list) return;
    // il blocco viene inserito subito (vuoto); si completa con doppio clic o Invio
    if (type === 'paste') {
      // incolla gli ultimi blocchi copiati; se non c'è nulla negli appunti non fa niente
      var clip = S.clip || AP.store.get('ap_clip', null);
      if (!clip) return;
      var copy;
      try { copy = M.cloneStmt(JSON.parse(clip)); } catch (e) { return; }
      A.insertStmt(copy, list, Math.min(idx, list.length));
      return;
    }
    var st = M.make(type);
    if (type === 'label') {
      var used = M.labelsIn(A.funcOfList(listId)).map(function (x) { return x.toLowerCase(); }), n = 0;
      while (used.indexOf('cond_' + n) >= 0) n++;
      st.name = 'cond_' + n;
    }
    A.insertStmt(st, list, Math.min(idx, list.length));
  };

  A.funcOfList = function (listId) {
    if (listId.indexOf('F:') === 0) { var fid = listId.slice(2); return S.prog.funcs.filter(function (f) { return f.id === fid; })[0]; }
    return M.funcOf(S.prog, listId.slice(0, listId.indexOf(':'))) || A.curFunc();
  };

  // aggiunge dopo la selezione (o in fondo alla funzione corrente)
  A.addAfterSelection = function (type) {
    if (!A.canEdit()) return;
    var r = selContext();
    if (r) {
      var lid = A.listIdOf(r);
      return A.addStmt(type, lid, r.index + 1);
    }
    var f = A.curFunc();
    return A.addStmt(type, AP.funcListId(f), f.body.length);
  };

  // id della lista che contiene lo statement
  A.listIdOf = function (r) {
    if (!r.parent) return AP.funcListId(r.func);
    var p = r.parent, key = null;
    if (p.type === 'if') key = p.yes === r.list ? 'yes' : 'no';
    else if (p.type === 'try') key = p.body === r.list ? 'body' : 'handler';
    else if (p.type === 'switch') {
      if (p.dflt === r.list) key = 'dflt';
      else p.cases.forEach(function (c) { if (c.body === r.list) key = 'c' + c.id; });
    } else key = 'body';
    return AP.listId(p, key);
  };

  A.editStmt = async function (id) {
    if (!A.canEdit()) return;
    var r = M.find(S.prog, id);
    if (!r) return;
    if (!needsDialog(r.stmt.type)) { UI.toast(tr('Questo blocco non ha impostazioni', 'This block has no settings')); return; }
    var d = await AP.editors.edit(r.stmt, { prog: S.prog, func: r.func, isNew: false, theme: A.theme() });
    if (!d) return;
    A.pushUndo();
    Object.keys(r.stmt).forEach(function (k) { if (!(k in d)) delete r.stmt[k]; });
    Object.assign(r.stmt, d);
    S.err = null;
    A.mark(); A.refreshAll();
  };

  A.deleteSel = function () {
    if (!A.canEdit()) return;
    var r = selContext();
    if (!r) return;
    A.pushUndo();
    r.list.splice(r.index, 1);
    var next = r.list[r.index] || r.list[r.index - 1] || r.parent;
    S.sel = next ? next.id : null;
    A.mark(); A.refreshAll();
  };

  A.moveSel = function (dir) {
    if (!A.canEdit()) return;
    var r = selContext();
    if (!r) return;
    var j = r.index + dir;
    if (j < 0 || j >= r.list.length) return;
    A.pushUndo();
    r.list.splice(j, 0, r.list.splice(r.index, 1)[0]);
    A.mark(); A.refreshAll();
  };

  A.moveStmtTo = function (id, listId, idx) {
    if (!A.canEdit()) return;
    var r = M.find(S.prog, id);
    var dest = AP.getList(S.prog, listId);
    if (!r || !dest) return;
    if (M.contains(r.stmt, listId.slice(0, listId.indexOf(':'))) || listId.slice(0, listId.indexOf(':')) === id) return;
    A.pushUndo();
    var before = r.list === dest && r.index < idx ? 1 : 0;
    r.list.splice(r.index, 1);
    dest.splice(Math.max(0, Math.min(dest.length, idx - before)), 0, r.stmt);
    S.sel = id;
    A.mark(); A.refreshAll();
  };

  A.copySel = function (cut) {
    var r = selContext();
    if (!r) return;
    S.clip = JSON.stringify(r.stmt);
    AP.store.set('ap_clip', S.clip);
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText('AlgorithmPath:' + S.clip).catch(function () { }); } catch (e) { }
    if (cut) A.deleteSel(); else A.updateBlockBar();
    UI.toast(cut ? tr('Blocco tagliato', 'Block cut') : tr('Blocco copiato', 'Block copied'));
  };

  A.pasteAfterSel = function () {
    if (!A.canEdit()) return;
    var clip = S.clip || AP.store.get('ap_clip', null);
    if (!clip) { UI.toast(tr('Gli appunti sono vuoti', 'Clipboard is empty')); return; }
    var s = M.cloneStmt(JSON.parse(clip));
    var r = selContext();
    if (r) A.insertStmt(s, r.list, r.index + 1);
    else { var f = A.curFunc(); A.insertStmt(s, f.body, f.body.length); }
  };

  A.duplicateSel = function () {
    if (!A.canEdit()) return;
    var r = selContext();
    if (!r) return;
    A.insertStmt(M.cloneStmt(r.stmt), r.list, r.index + 1);
  };

  A.toggleBp = function (id) {
    id = id || S.sel;
    var r = id && M.find(S.prog, id);
    if (!r) return;
    if (S.state === 'running') { r.stmt.bp = !r.stmt.bp; A.renderChart(); return; }
    A.pushUndo();
    r.stmt.bp = !r.stmt.bp;
    A.mark(); A.renderChart();
  };

  A.wrapSel = function (type) {
    if (!A.canEdit()) return;
    var r = selContext();
    if (!r) return;
    var w = M.make(type);
    if (type === 'if') w.cond = 'true'; else if (type === 'while') w.cond = 'true';
    A.pushUndo();
    if (type === 'if') w.yes = [r.stmt]; else if (type === 'try') w.body = [r.stmt]; else w.body = [r.stmt];
    r.list.splice(r.index, 1, w);
    S.sel = w.id;
    A.mark(); A.refreshAll();
    A.editStmt(w.id);
  };

  // ------------------------------------------------------------------ menu "aggiungi"
  function kindColor(type) {
    var kinds = A.theme().kinds, k = kinds[M.KIND[type]] || kinds.assign;
    return 'linear-gradient(135deg,' + k.a + ',' + k.b + ')';
  }
  A.kindColor = kindColor;

  A.showAddMenu = function (listId, idx, x, y) {
    if (!A.canEdit()) return;
    var items = [];
    M.CATALOG.forEach(function (cat) {
      items.push({ header: AP.lang === 'en' ? cat.en : cat.it });
      cat.items.forEach(function (it) {
        items.push({ label: AP.lang === 'en' ? it.en : it.it, chip: kindColor(it.type), glyph: it.icon, onClick: function () { A.addStmt(it.type, listId, idx); } });
      });
    });
    UI.menu(items, x, y);
  };

  A.showBlockMenu = function (id, x, y) {
    var r = M.find(S.prog, id);
    if (!r) return;
    var idle = S.state === 'idle' || S.state === 'finished' || S.state === 'error';
    var items = [];
    if (needsDialog(r.stmt.type)) items.push({ label: tr('Modifica…', 'Edit…'), icon: 'edit', sc: 'Invio', onClick: function () { A.editStmt(id); } });
    items.push({ label: r.stmt.bp ? tr('Rimuovi punto di arresto', 'Remove breakpoint') : tr('Imposta punto di arresto', 'Set breakpoint'), icon: 'bp', sc: 'F9', onClick: function () { A.toggleBp(id); } });
    if (idle) {
      items.push({ sep: true });
      items.push({ label: tr('Copia', 'Copy'), icon: 'copy', sc: 'Ctrl+C', onClick: function () { A.copySel(false); } });
      items.push({ label: tr('Taglia', 'Cut'), icon: 'cut', sc: 'Ctrl+X', onClick: function () { A.copySel(true); } });
      items.push({ label: tr('Incolla sotto', 'Paste below'), icon: 'paste', sc: 'Ctrl+V', disabled: !S.clip && !AP.store.get('ap_clip', null), onClick: function () { A.pasteAfterSel(); } });
      items.push({ label: tr('Duplica', 'Duplicate'), icon: 'copy', sc: 'Ctrl+D', onClick: function () { A.duplicateSel(); } });
      items.push({ sep: true });
      items.push({ label: tr('Sposta su', 'Move up'), icon: 'up', disabled: r.index === 0, onClick: function () { A.moveSel(-1); } });
      items.push({ label: tr('Sposta giù', 'Move down'), icon: 'down', disabled: r.index === r.list.length - 1, onClick: function () { A.moveSel(1); } });
      items.push({ sep: true });
      items.push({ header: tr('Racchiudi in…', 'Wrap in…') });
      items.push({ label: tr('Se / Altrimenti', 'If / Else'), chip: kindColor('if'), glyph: '◇', onClick: function () { A.wrapSel('if'); } });
      items.push({ label: tr('Mentre', 'While'), chip: kindColor('while'), glyph: '↻', onClick: function () { A.wrapSel('while'); } });
      items.push({ label: tr('Prova / Errore', 'Try / Catch'), chip: kindColor('try'), glyph: '⛨', onClick: function () { A.wrapSel('try'); } });
      items.push({ sep: true });
      items.push({ label: tr('Elimina', 'Delete'), icon: 'trash', danger: true, sc: 'Canc', onClick: function () { A.deleteSel(); } });
    }
    UI.menu(items, x, y);
  };

  // ------------------------------------------------------------------ palette
  A.renderPalette = function () {
    var q = ($('palSearch').value || '').trim().toLowerCase();
    var box = $('palList');
    box.innerHTML = '';
    M.CATALOG.forEach(function (cat) {
      var its = cat.items.filter(function (it) { return !q || (it.it + ' ' + it.en).toLowerCase().indexOf(q) >= 0; });
      if (!its.length) return;
      var c = h('div', { class: 'palcat' }, [h('h4', { text: AP.lang === 'en' ? cat.en : cat.it })]);
      its.forEach(function (it) {
        var el = h('div', { class: 'palitem', 'data-type': it.type, tabindex: '0', title: AP.lang === 'en' ? it.en : it.it }, [
          h('span', { class: 'chipic', style: { background: kindColor(it.type) }, text: it.icon }),
          h('span', { text: AP.lang === 'en' ? it.en : it.it })
        ]);
        el.addEventListener('keydown', function (e) { if (e.key === 'Enter') A.addAfterSelection(it.type); });
        c.appendChild(el);
      });
      box.appendChild(c);
    });
  };

  // ------------------------------------------------------------------ aggiornamento globale
  A.refreshAll = function () {
    A.renderTabs();
    A.renderChart();
    A.updateUndoButtons();
    A.updateRunButtons && A.updateRunButtons();
    A.refreshCode && A.refreshCode();
  };

  // ------------------------------------------------------------------ zoom
  A.setZoom = function (z, anchor) {
    z = Math.max(0.2, Math.min(3, z));
    var vp = $('viewport');
    var old = S.zoom;
    var cx = anchor ? anchor.x : vp.clientWidth / 2, cy = anchor ? anchor.y : vp.clientHeight / 2;
    var fx = (vp.scrollLeft + cx) / old, fy = (vp.scrollTop + cy) / old;
    S.zoom = z;
    var svg = $('chartHost').firstChild;
    if (svg) { svg.style.width = (S.chartW * z) + 'px'; svg.style.height = (S.chartH * z) + 'px'; }
    vp.scrollLeft = fx * z - cx; vp.scrollTop = fy * z - cy;
    $('zoomLabel').textContent = Math.round(z * 100) + '%';
  };
  A.fit = function () {
    var vp = $('viewport');
    var z = Math.min((vp.clientWidth - 30) / S.chartW, (vp.clientHeight - 30) / S.chartH, 1.25);
    A.setZoom(Math.max(0.2, z));
    vp.scrollTo(0, 0);
  };

  // ------------------------------------------------------------------ trascinamento (blocchi e palette)
  var drag = null;
  function startDrag(kind, payload, label, e) {
    drag = { kind: kind, payload: payload, label: label, sx: e.clientX, sy: e.clientY, on: false, ghost: null, ins: [], target: null, raf: 0, px: e.clientX, py: e.clientY };
  }
  function descendantsOf(stmt) {
    var set = {}; set[stmt.id] = 1;
    M.walk([stmt], function (s) { set[s.id] = 1; });
    return set;
  }
  function beginDragVisual() {
    drag.on = true;
    drag.ghost = h('div', { class: 'ghost', text: drag.label });
    document.body.appendChild(drag.ghost);
    document.body.classList.add('dragging');
    var banned = drag.kind === 'move' ? descendantsOf(M.find(S.prog, drag.payload).stmt) : {};
    drag.ins = Array.prototype.slice.call($('chartHost').querySelectorAll('.ins')).filter(function (el) {
      var lid = el.getAttribute('data-list');
      if (lid.indexOf('F:') === 0) return true;
      return !banned[lid.slice(0, lid.indexOf(':'))];
    }).map(function (el) { var r = el.getBoundingClientRect(); return { el: el, x: r.left + r.width / 2, y: r.top + r.height / 2 }; });
    drag.ins.forEach(function (i) { i.el.style.opacity = '.55'; });
    var loop = function () {
      if (!drag) return;
      var vp = $('viewport'), r = vp.getBoundingClientRect();
      if (drag.px > r.left && drag.px < r.right) {
        if (drag.py < r.top + 50) vp.scrollTop -= 14; else if (drag.py > r.bottom - 50) vp.scrollTop += 14;
      }
      if (drag.px > r.left && drag.py > r.top && drag.py < r.bottom) {
        if (drag.px < r.left + 40) vp.scrollLeft -= 14; else if (drag.px > r.right - 40) vp.scrollLeft += 14;
      }
      drag.raf = requestAnimationFrame(loop);
    };
    drag.raf = requestAnimationFrame(loop);
  }
  function updateDragTarget() {
    var best = null, bd = 56 * 56;
    var vr = $('viewport').getBoundingClientRect();
    if (drag.px >= vr.left && drag.px <= vr.right && drag.py >= vr.top && drag.py <= vr.bottom) {
      drag.ins.forEach(function (i) {
        var r = i.el.getBoundingClientRect();
        var d = Math.pow(r.left + r.width / 2 - drag.px, 2) + Math.pow(r.top + r.height / 2 - drag.py, 2);
        if (d < bd) { bd = d; best = i; }
      });
    }
    if (drag.target && (!best || drag.target.el !== best.el)) drag.target.el.classList.remove('target');
    drag.target = best;
    if (best) best.el.classList.add('target');
  }
  document.addEventListener('pointermove', function (e) {
    if (!drag) return;
    drag.px = e.clientX; drag.py = e.clientY;
    if (!drag.on) {
      if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) < 7) return;
      beginDragVisual();
    }
    drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
    updateDragTarget();
  });
  function endDrag(e, cancel) {
    if (!drag) return;
    var d = drag; drag = null;
    cancelAnimationFrame(d.raf);
    document.body.classList.remove('dragging');
    if (d.ghost) d.ghost.remove();
    d.ins.forEach(function (i) { i.el.style.opacity = ''; i.el.classList.remove('target'); });
    if (!d.on) return d.kind === 'palette' && !cancel ? A.addAfterSelection(d.payload) : null;
    A._justDragged = true; setTimeout(function () { A._justDragged = false; }, 50);
    if (cancel || !d.target) return;
    var lid = d.target.el.getAttribute('data-list'), idx = parseInt(d.target.el.getAttribute('data-idx'), 10);
    if (d.kind === 'palette') A.addStmt(d.payload, lid, idx);
    else A.moveStmtTo(d.payload, lid, idx);
  }
  document.addEventListener('pointerup', function (e) { endDrag(e, false); });
  document.addEventListener('pointercancel', function (e) { endDrag(e, true); });

  // ------------------------------------------------------------------ eventi del diagramma
  var pan = null;
  function bindChartEvents() {
    var vp = $('viewport');
    vp.addEventListener('click', function (e) {
      if (A._justDragged || pan && pan.moved) return;
      var t = e.target;
      var ins = t.closest && t.closest('.ins');
      if (ins) { var r = ins.getBoundingClientRect(); A.showAddMenu(ins.getAttribute('data-list'), parseInt(ins.getAttribute('data-idx'), 10), r.right + 4, r.top - 10); return; }
      var bp = t.closest && t.closest('.bp');
      if (bp) { A.toggleBp(bp.getAttribute('data-bp')); return; }
      var blk = t.closest && t.closest('.blk');
      if (blk) { A.select(blk.getAttribute('data-id'), true); return; }
      A.select(null);
    });
    vp.addEventListener('dblclick', function (e) {
      var blk = e.target.closest && e.target.closest('.blk');
      if (blk && !e.target.closest('.bp') && !e.target.closest('.ins')) A.editStmt(blk.getAttribute('data-id'));
    });
    vp.addEventListener('contextmenu', function (e) {
      var ins = e.target.closest && e.target.closest('.ins');
      if (ins) { e.preventDefault(); A.showAddMenu(ins.getAttribute('data-list'), parseInt(ins.getAttribute('data-idx'), 10), e.clientX, e.clientY); return; }
      var blk = e.target.closest && e.target.closest('.blk');
      if (blk) { e.preventDefault(); A.select(blk.getAttribute('data-id'), true); A.showBlockMenu(blk.getAttribute('data-id'), e.clientX, e.clientY); }
    });
    vp.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      var t = e.target;
      var blk = t.closest && t.closest('.blk');
      if (blk && !t.closest('.bp') && !t.closest('.warn') && (S.state === 'idle' || S.state === 'finished' || S.state === 'error')) {
        var id = blk.getAttribute('data-id');
        var r = M.find(S.prog, id);
        startDrag('move', id, r ? M.kindLabel(r.stmt.type) + ': ' + M.caption(r.stmt).slice(0, 28) : '', e);
        return;
      }
      if (!blk && !(t.closest && t.closest('.ins')) && !(t.closest && t.closest('.bp'))) {
        pan = { x: e.clientX, y: e.clientY, sl: vp.scrollLeft, st: vp.scrollTop, moved: false };
        vp.setPointerCapture && vp.setPointerCapture(e.pointerId);
      }
    });
    vp.addEventListener('pointermove', function (e) {
      if (!pan) return;
      var dx = e.clientX - pan.x, dy = e.clientY - pan.y;
      if (!pan.moved && Math.abs(dx) + Math.abs(dy) > 4) { pan.moved = true; vp.classList.add('panning'); }
      if (pan.moved) { vp.scrollLeft = pan.sl - dx; vp.scrollTop = pan.st - dy; }
    });
    function endPan(e) {
      if (!pan) return;
      vp.classList.remove('panning');
      var wasMoved = pan.moved;
      setTimeout(function () { pan = null; }, 0);
      if (!wasMoved) pan = null;
    }
    vp.addEventListener('pointerup', endPan);
    vp.addEventListener('pointercancel', endPan);
    vp.addEventListener('wheel', function (e) {
      if (!(e.ctrlKey || e.metaKey)) return;
      e.preventDefault();
      var r = vp.getBoundingClientRect();
      A.setZoom(S.zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1), { x: e.clientX - r.left, y: e.clientY - r.top });
    }, { passive: false });

    // palette
    $('palList').addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      var it = e.target.closest('.palitem');
      if (!it) return;
      if (!A.canEdit()) return;
      startDrag('palette', it.getAttribute('data-type'), it.textContent.trim(), e);
    });
    $('palSearch').addEventListener('input', A.renderPalette);
  }

  // ------------------------------------------------------------------ tastiera
  function bindKeys() {
    document.addEventListener('keydown', function (e) {
      var tag = (e.target.tagName || '').toLowerCase();
      var typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
      var ctrl = e.ctrlKey || e.metaKey;
      if (e.key === 'F5') { e.preventDefault(); if (e.shiftKey) A.stopRun(); else A.startRun(false); return; }
      if (e.key === 'F10') { e.preventDefault(); A.stepRun(); return; }
      if (e.key === 'Escape' && UI.hasModal() && !UI.menuOpen()) { UI.closeTop(); return; }
      if (UI.hasModal() || UI.menuOpen()) return;
      if (ctrl && e.key.toLowerCase() === 's') { e.preventDefault(); A.saveFile(); return; }
      if (ctrl && e.key.toLowerCase() === 'o') { e.preventDefault(); $('fileInput').click(); return; }
      if (typing) return;
      if (ctrl && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) A.redo(); else A.undo(); return; }
      if (ctrl && e.key.toLowerCase() === 'y') { e.preventDefault(); A.redo(); return; }
      if (ctrl && e.key.toLowerCase() === 'c') { if (S.sel) { e.preventDefault(); A.copySel(false); } return; }
      if (ctrl && e.key.toLowerCase() === 'x') { if (S.sel) { e.preventDefault(); A.copySel(true); } return; }
      if (ctrl && e.key.toLowerCase() === 'v') { e.preventDefault(); A.pasteAfterSel(); return; }
      if (ctrl && e.key.toLowerCase() === 'd') { e.preventDefault(); A.duplicateSel(); return; }
      if (e.key === 'F9') { e.preventDefault(); A.toggleBp(); return; }
      if (e.key === 'Delete' || e.key === 'Backspace') { if (S.sel) { e.preventDefault(); A.deleteSel(); } return; }
      if (e.key === 'Enter') { if (S.sel) { e.preventDefault(); A.editStmt(S.sel); } return; }
      if (e.key === 'Escape') { A.select(null); return; }
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        var seq = [];
        M.walk(A.curFunc().body, function (s) { seq.push(s.id); });
        if (!seq.length) return;
        e.preventDefault();
        var i = seq.indexOf(S.sel);
        i = e.key === 'ArrowDown' ? Math.min(seq.length - 1, i + 1) : Math.max(0, i < 0 ? 0 : i - 1);
        A.select(seq[i]);
      }
      if (e.key === '+' || e.key === '=') A.setZoom(S.zoom * 1.1);
      if (e.key === '-') A.setZoom(S.zoom / 1.1);
    });
  }

  // ------------------------------------------------------------------ file .algp
  A.serialize = function () {
    S.prog.meta.modified = new Date().toISOString();
    return JSON.stringify({ app: 'AlgorithmPath', version: 1, meta: S.prog.meta, funcs: S.prog.funcs, view: { theme: S.settings.theme, style: S.settings.style } }, null, 1);
  };
  function safeName(n) { return (n || 'programma').replace(/[\\/:*?"<>|]+/g, '_').trim().replace(/\s+/g, '_') || 'programma'; }
  A.saveFile = function () {
    AP.download(safeName(S.prog.meta.name) + '.algp', A.serialize(), 'application/json');
    S.dirty = false;
    A.status(tr('Programma salvato come ', 'Program saved as ') + safeName(S.prog.meta.name) + '.algp', 'ok');
  };
  A.loadText = function (text, name) {
    var data;
    try { data = JSON.parse(text); } catch (e) { UI.alert(tr('File non valido', 'Invalid file'), tr('Il file non è un documento Algorithm Path (.algp) valido.', 'The file is not a valid Algorithm Path (.algp) document.'), 'err'); return; }
    if (!data || data.app !== 'AlgorithmPath' || !Array.isArray(data.funcs)) { UI.alert(tr('File non valido', 'Invalid file'), tr('Il file non è un documento Algorithm Path (.algp) valido.', 'The file is not a valid Algorithm Path (.algp) document.'), 'err'); return; }
    A.setProgram({ app: data.app, version: data.version, meta: data.meta, funcs: data.funcs }, name);
    A.status(tr('Aperto: ', 'Opened: ') + (name || S.prog.meta.name), 'ok');
  };
  A.openFile = async function (file) {
    if (S.state !== 'idle' && S.state !== 'finished') { UI.toast(tr('Ferma prima l\'esecuzione', 'Stop the run first')); return; }
    if (S.dirty && !(await UI.confirm(tr('Ci sono modifiche non salvate. Aprire comunque il file?', 'There are unsaved changes. Open the file anyway?'), tr('Apri', 'Open'), true))) return;
    var rd = new FileReader();
    rd.onload = function () { A.loadText(rd.result, file.name); };
    rd.readAsText(file);
  };

  // ------------------------------------------------------------------ pannello laterale
  A.showTab = function (tab) {
    S.settings.sideTab = tab;
    document.querySelectorAll('#sideTabs button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === tab); });
    ['console', 'vars', 'turtle', 'code'].forEach(function (t) {
      $('p' + t.charAt(0).toUpperCase() + t.slice(1)).classList.toggle('on', t === tab);
    });
    if (tab === 'turtle' && A.turtle) setTimeout(function () { A.turtle.resize(); A.turtle.present(); }, 20);
    if (tab === 'code' && A.refreshCode) A.refreshCode();
    if (tab === 'vars' && A.refreshVars) A.refreshVars();
  };

  function bindShell() {
    $('btnNew').onclick = A.newProgram;
    $('btnOpen').onclick = function () { $('fileInput').click(); };
    $('fileInput').onchange = function (e) { var f = e.target.files[0]; if (f) A.openFile(f); e.target.value = ''; };
    $('btnSave').onclick = A.saveFile;
    $('btnUndo').onclick = A.undo; $('btnRedo').onclick = A.redo;
    $('zoomIn').onclick = function () { A.setZoom(S.zoom * 1.15); };
    $('zoomOut').onclick = function () { A.setZoom(S.zoom / 1.15); };
    $('zoomFit').onclick = A.fit;
    $('zoomLabel').onclick = function () { A.setZoom(1); };
    $('bbEdit').onclick = function () { if (S.sel) A.editStmt(S.sel); };
    $('bbUp').onclick = function () { A.moveSel(-1); };
    $('bbDown').onclick = function () { A.moveSel(1); };
    $('bbCopy').onclick = function () { A.copySel(false); };
    $('bbCut').onclick = function () { A.copySel(true); };
    $('bbPaste').onclick = A.pasteAfterSel;
    $('bbBp').onclick = function () { A.toggleBp(); };
    $('bbDel').onclick = A.deleteSel;
    $('progName').addEventListener('input', function () {
      S.prog.meta.name = $('progName').value; A.mark();
    });
    $('progName').addEventListener('keydown', function (e) { if (e.key === 'Enter') e.target.blur(); });
    document.querySelectorAll('#sideTabs button').forEach(function (b) { b.onclick = function () { A.showTab(b.getAttribute('data-tab')); A.saveSettings(); }; });

    // divisore
    var sp = $('splitter'), side = $('side');
    sp.addEventListener('pointerdown', function (e) {
      sp.setPointerCapture(e.pointerId); sp.classList.add('drag');
      var startX = e.clientX, startW = side.getBoundingClientRect().width;
      var mv = function (ev) { var w = Math.max(260, Math.min(window.innerWidth * 0.7, startW - (ev.clientX - startX))); side.style.width = w + 'px'; S.settings.sideW = w; if (A.turtle) { A.turtle.resize(); } };
      var up = function () { sp.classList.remove('drag'); sp.removeEventListener('pointermove', mv); sp.removeEventListener('pointerup', up); A.saveSettings(); };
      sp.addEventListener('pointermove', mv); sp.addEventListener('pointerup', up);
    });

    // trascinamento file
    var dragDepth = 0;
    window.addEventListener('dragenter', function (e) { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') >= 0) { dragDepth++; $('dropHint').classList.remove('hidden'); } });
    window.addEventListener('dragleave', function () { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('dropHint').classList.add('hidden'); });
    window.addEventListener('dragover', function (e) { e.preventDefault(); });
    window.addEventListener('drop', function (e) {
      e.preventDefault(); dragDepth = 0; $('dropHint').classList.add('hidden');
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) A.openFile(f);
    });
    window.addEventListener('beforeunload', function (e) { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
    window.addEventListener('resize', function () { if (A.turtle) A.turtle.resize(); });
    if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', A.applyUiTheme);
    if ('launchQueue' in window) {
      window.launchQueue.setConsumer(function (lp) {
        if (!lp.files || !lp.files.length) return;
        lp.files[0].getFile().then(function (f) { A.openFile(f); });
      });
    }
  }

  A.applyLanguage = function () {
    AP.lang = S.settings.lang;
    UI.applyLang(document);
    A.renderPalette();
    A.updateSpeedLabel && A.updateSpeedLabel();
    A.refreshAll();
    A.buildLangSelect && A.buildLangSelect();
  };

  // ------------------------------------------------------------------ avvio
  // niente menu del browser (Esamina, ecc.) col tasto destro, tranne nei campi di testo
  document.addEventListener('contextmenu', function (e) {
    var t = e.target;
    if (t.closest && t.closest('input, textarea')) return;
    e.preventDefault();
  });

  A.init = function () {
    A.loadSettings();
    A.applyUiTheme();
    UI.fillIcons(document);
    $('side').style.width = S.settings.sideW + 'px';
    bindShell(); bindChartEvents(); bindKeys();
    A.initRun && A.initRun();
    A.initDialogs && A.initDialogs();
    UI.applyLang(document);
    A.renderPalette();
    var auto = AP.store.get('ap_autosave', null);
    if (auto && auto.prog && auto.prog.funcs) {
      A.setProgram(auto.prog, auto.file || '');
      if (auto.fid && S.prog.funcs.some(function (f) { return f.id === auto.fid; })) { S.fid = auto.fid; A.refreshAll(); }
    } else {
      A.setProgram(M.newProgram());
    }
    S.dirty = false;
    A.showTab(S.settings.sideTab || 'console');
    A.status(tr('Benvenuto in Algorithm Path! Clic sui "+" del diagramma per aggiungere blocchi.', 'Welcome to Algorithm Path! Click the "+" on the chart to add blocks.'), 'ok', 6000);
    document.title = 'Algorithm Path';
  };

  document.addEventListener('DOMContentLoaded', A.init);
})(window.AP);

</script>
</body>
